name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: zeus
            runner: ubuntu-latest
            attr: nixosConfigurations.zeus.config.system.build.toplevel
          - host: mbp2023
            runner: macos-latest
            attr: darwinConfigurations.mbp2023.system
          - host: ondorse
            runner: macos-latest
            attr: darwinConfigurations.ondorse.system

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the PR base commit can be built for the diff.
          fetch-depth: 0

      # The zeus closure unpacks to ~20 GiB, more than a stock Ubuntu runner
      # has free. Must run before Nix is installed, since it mounts /nix.
      - name: Free disk space
        if: runner.os == 'Linux'
        uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      # Optional: set the CACHIX_CACHE repo variable (and CACHIX_AUTH_TOKEN
      # secret to push) to reuse builds across runs. Without it, everything
      # not on cache.nixos.org is rebuilt each time.
      - name: Set up Cachix
        if: vars.CACHIX_CACHE != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        run: nix build ".#${{ matrix.attr }}" --out-link result-new

      - name: Neovim smoke test
        run: ./scripts/nvim-test.sh ${{ matrix.host }}

      # Base is the PR's base, or main for a manually dispatched branch run.
      - name: Build base
        id: base
        if: github.ref != 'refs/heads/main'
        # A broken base shouldn't fail the PR that might be fixing it.
        continue-on-error: true
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE:-$(git merge-base origin/main HEAD)}"
          nix build "git+file://$PWD?rev=$base#${{ matrix.attr }}" --out-link result-old

      - name: Package diff
        if: steps.base.outcome == 'success'
        run: |
          nix run --inputs-from . nixpkgs#nvd -- --color never diff result-old result-new > nvd.txt
          {
            echo "<details><summary><b>${{ matrix.host }}</b>: $(grep -m1 '^Closure size' nvd.txt)</summary>"
            echo
            echo '```'
            cat nvd.txt
            echo '```'
            echo '</details>'
          } > "diff-${{ matrix.host }}.md"
          cat "diff-${{ matrix.host }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package diff
        if: steps.base.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diff-${{ matrix.host }}
          path: diff-${{ matrix.host }}.md

  # One comment per PR with all hosts' diffs, edited in place on each push.
  # Skipped for fork PRs, whose token can't comment.
  comment:
    name: Comment package diff
    needs: build
    if: >-
      !cancelled() && github.ref != 'refs/heads/main' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download package diffs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: diff-*
          merge-multiple: true

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          diffs=(diff-*.md)
          [ ${#diffs[@]} -gt 0 ] || exit 0
          # Dispatched runs have no PR in the event; look it up by branch.
          pr="${PR:-$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty')}"
          [ -n "$pr" ] || exit 0
          {
            echo "### Package diff against \`main\`"
            echo
            cat "${diffs[@]}"
          } | head -c 60000 > body.md # GitHub caps comments at 65536 chars
          gh pr comment "$pr" --edit-last --create-if-none --body-file body.md
