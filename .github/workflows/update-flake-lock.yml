name: Update flake.lock

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write # for the new-release reminder

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          # A PR opened with GITHUB_TOKEN doesn't get a normal PR build (it waits
          # for approval). A fine-grained PAT (Contents + Pull requests: write
          # on this repo only) makes it a PR by the owner, which builds at once.
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          branch: flake-update
          pr-title: "flake.lock: update"
          pr-body: |
            Weekly `nix flake update`. CI posts each host's package diff below;
            review it, merge, then switch.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```

      # flake.lock updates never leave the release branch named in flake.nix,
      # so moving to the next NixOS release is manual. Open an issue (once per
      # release) when a newer nixos-YY.MM branch exists.
      - name: Check for a newer NixOS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_branch() {
            git ls-remote --heads "https://github.com/$1" "refs/heads/$2*" |
              grep -oE "$2[0-9]{2}\.[0-9]{2}$" | sort -V | tail -1
          }
          current="$(grep -oE 'nixos-[0-9]{2}\.[0-9]{2}' flake.nix | head -1)"
          latest="$(latest_branch NixOS/nixpkgs nixos-)"
          [ "$latest" != "$current" ] || exit 0

          release="${latest#nixos-}"
          title="NixOS $release is available"
          if [ -n "$(gh issue list --state all --search "in:title \"$title\"" --json number --jq '.[0].number // empty')" ]; then
            exit 0
          fi
          gh issue create --title "$title" --body-file - <<EOF
          The \`$latest\` branch exists; \`flake.nix\` is on \`$current\`. A new branch
          can appear a few weeks before the release (beta). \`$current\` keeps getting
          fixes for about a month after $release ships, then stops.

          Latest branches today:
          - nixpkgs: \`$latest\`
          - home-manager: \`$(latest_branch nix-community/home-manager release-)\`
          - nix-darwin: \`$(latest_branch nix-darwin/nix-darwin nix-darwin-)\`

          To upgrade, once all three have a $release branch:
          1. In \`flake.nix\`, move \`nixpkgs\`, \`home-manager\` and \`darwin\` to their $release branches together.
          2. \`nix flake update nixpkgs home-manager darwin\`, open a PR and fix what the
             [release notes](https://nixos.org/manual/nixos/stable/release-notes) broke.
          3. Leave \`stateVersion\` alone.
          EOF
