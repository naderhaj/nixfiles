
# automatically renumber tmux windows
set -g renumber-windows on

# Window name: for a Claude Code pane, "cl_" + its session title (Claude writes it to the
# pane title as "<status glyph> <title>"; drop the glyph, cap at 19 chars + "…").
# Anything else keeps tmux's default (the running command).
set -g automatic-rename-format '#{?#{m:*claude*,#{pane_current_command}},cl_#{s/ +$//:#{=19:#{s/^[^ ]+ //:pane_title}}}#{?#{e|>:#{n:#{s/^[^ ]+ //:pane_title}},19},…,},#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}}'

# Activity Monitoring
setw -g monitor-activity off
set -g visual-activity off

# 24-bit color passthrough for Ghostty
set -as terminal-features ",xterm-ghostty:RGB"

# make window/pane index start with 1
setw -g pane-base-index 1

############ Key Bindings ############

# reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# new windows also start in the current pane's directory
bind c new-window -c "#{pane_current_path}"

# synchronize all panes in a window
bind y setw synchronize-panes

# pane movement shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resize pane shortcuts
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# Remap x to avoid confirmation to kill pane
bind-key x kill-pane

# Move windows
bind-key S-Left swap-window -t -1\; select-window -t -1
bind-key S-Right swap-window -t +1\; select-window -t +1

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe #"xclip"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
